[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particourts-geo-builder"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
particourts-geo-builder = "geo_builder.__main__:main"

[tool.setuptools]
package-dir = {geo_builder = "."}
packages = ["geo_builder"]