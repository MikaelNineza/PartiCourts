[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "particourts-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
]

[project.scripts]
particourts-scrape = "scraper.__main__:main"

[tool.setuptools]
package-dir = {scraper = "."}
packages = ["scraper"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]